spring.application.name=ms-andesstay-catalog
server.port=8081

# --- Conexion a PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/andesstay_catalog}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Inicializacion SQL (schema.sql / data.sql):
# En Docker Desktop con docker-compose se monta en /docker-entrypoint-initdb.d/
# En ejecucion manual puede activarse con SQL_INIT_MODE=always
spring.sql.init.mode=${SQL_INIT_MODE:never}

# --- Seguridad: AWS Cognito ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${COGNITO_REGION:us-east-1}.amazonaws.com/${COGNITO_USER_POOL_ID:CHANGE_ME}
cognito.app-client-id=${COGNITO_APP_CLIENT_ID:CHANGE_ME}

# --- CORS ---
# Habilitado para permitir peticiones desde Angular (http://localhost:4200) o BFF local
cors.allowed-origins=${FRONTEND_URL:http://localhost:4200}
cors.enabled=${CORS_ENABLED:true}

# --- Actuator ---
management.endpoints.web.exposure.include=health
