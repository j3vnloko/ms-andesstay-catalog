spring.application.name=ms-andesstay-catalog
server.port=8081

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/andesstay_catalog
spring.datasource.username=${DB_USERNAME:postgres}
# Sin valor por defecto: hay que exportar DB_PASSWORD si o si.
# (Antes tenia un password quemado aqui - cambia esa contrasena en Postgres,
# ya quedo expuesta si el repo es publico)
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Seguridad: AWS Cognito ---
# Reemplazar {region} y {userPoolId} por los del User Pool real.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${COGNITO_REGION:us-east-1}.amazonaws.com/${COGNITO_USER_POOL_ID:CHANGE_ME}
cognito.app-client-id=${COGNITO_APP_CLIENT_ID:CHANGE_ME}

# Origen del frontend Angular
cors.allowed-origins=${FRONTEND_URL:http://localhost:4200}