spring.application.name=ms-andesstay-catalog
server.port=8081

# Conexion a PostgreSQL (fase 1, local)
# A diferencia de MySQL, Postgres NO crea la base de datos sola:
# antes de correr, crea manualmente la base "andesstay_catalog" con pgAdmin o:
#   psql -U postgres -c "CREATE DATABASE andesstay_catalog;"
spring.datasource.url=jdbc:postgresql://localhost:5432/andesstay_catalog
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:jean2003}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
