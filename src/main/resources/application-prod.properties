spring.application.name=ms-andesstay-catalog
server.port=8081

# --- Conexion a PostgreSQL (RDS) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# En produccion NO se modifica el schema con JPA; se usa schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Ejecutar schema.sql y data.sql al arrancar (idempotentes con IF NOT EXISTS / ON CONFLICT)
spring.sql.init.mode=always

# --- Seguridad: AWS Cognito ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${COGNITO_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}
cognito.app-client-id=${COGNITO_APP_CLIENT_ID}

# --- CORS ---
# Si el API Gateway ya inyecta headers CORS, poner cors.enabled=false
cors.allowed-origins=${FRONTEND_URL}
cors.enabled=${CORS_ENABLED:false}

# --- Actuator ---
management.endpoints.web.exposure.include=health

# --- Logging razonable para produccion ---
logging.level.root=WARN
logging.level.cl.duoc.andesstay.catalog=INFO
logging.level.org.springframework.security=WARN

